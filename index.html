<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Coop Reconciliation Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#EEF1EC; --panel:#FFFFFF; --panel2:#F7F8F5; --ink:#17223A; --muted:#5B6576; --line:#D6DBD3; --line2:#E6EAE3;
  --brand:#0E5A61; --brand-ink:#FFFFFF; --brand-soft:#DCEBEA;
  --ok:#2B7A4B; --ok-soft:#DFF0E5;
  --dup:#A85F00; --dup-soft:#FBEBD2;
  --miss:#B42318; --miss-soft:#FBE1DE;
  --only:#6440B8; --only-soft:#ECE4FA;
  --diff:#1560D4; --diff-soft:#DDE8FB;
  --shadow:0 1px 0 rgba(23,34,58,.06);
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#12181F; --panel:#19212A; --panel2:#1F2832; --ink:#E6EBF0; --muted:#98A3B0; --line:#2E3945; --line2:#26303B;
  --brand:#4FB3B9; --brand-ink:#0B1A1C; --brand-soft:#173338;
  --ok:#5BC08A; --ok-soft:#173327; --dup:#F0A640; --dup-soft:#3A2B14; --miss:#F17065; --miss-soft:#3D1D1B;
  --only:#A98BF0; --only-soft:#2A2340; --diff:#6FA3F5; --diff-soft:#1B2A45; --shadow:none;
}}
:root[data-theme="dark"]{
  --bg:#12181F; --panel:#19212A; --panel2:#1F2832; --ink:#E6EBF0; --muted:#98A3B0; --line:#2E3945; --line2:#26303B;
  --brand:#4FB3B9; --brand-ink:#0B1A1C; --brand-soft:#173338;
  --ok:#5BC08A; --ok-soft:#173327; --dup:#F0A640; --dup-soft:#3A2B14; --miss:#F17065; --miss-soft:#3D1D1B;
  --only:#A98BF0; --only-soft:#2A2340; --diff:#6FA3F5; --diff-soft:#1B2A45; --shadow:none;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:14px/1.45 "Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.num{text-align:right;white-space:nowrap}
.muted{color:var(--muted)}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px;padding:10px 20px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0}
.mark{width:30px;height:30px;border-radius:8px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font-weight:800;font-size:13px;flex:none}
.brand h1{font-size:16px;margin:0;font-weight:700;letter-spacing:-.01em}
.brand p{margin:0;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lookup{display:flex;align-items:center;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:0 4px 0 10px;height:36px}
.lookup label{font-size:12px;color:var(--muted);margin-right:8px;white-space:nowrap}
.lookup input{border:0;background:transparent;width:90px;height:34px;outline:none;font-weight:600}
.lookup button{border:0;background:var(--brand);color:var(--brand-ink);border-radius:6px;height:28px;padding:0 10px;font-weight:600;font-size:12px}
.btn{height:36px;padding:0 14px;border-radius:8px;border:1px solid var(--line);background:var(--panel);font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{background:var(--panel2)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.small{height:30px;padding:0 10px;font-size:12px}
.btn[disabled]{opacity:.5;cursor:not-allowed}

/* shell */
.shell{display:grid;grid-template-columns:280px minmax(0,1fr);min-height:calc(100% - 57px)}
.rail{border-right:1px solid var(--line);background:var(--panel2);padding:14px 12px;position:sticky;top:57px;align-self:start;max-height:calc(100vh - 57px);overflow:auto}
.rail h2{font-size:12px;color:var(--muted);font-weight:600;margin:4px 8px 10px}
.srow{display:block;width:100%;text-align:left;border:1px solid transparent;background:transparent;border-radius:10px;padding:10px;margin-bottom:4px}
.srow:hover{background:var(--panel)}
.srow[aria-current="true"]{background:var(--panel);border-color:var(--line);box-shadow:var(--shadow)}
.srow .l1{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.srow .sid{font-weight:700;font-size:15px}
.srow .sub{font-size:12px;color:var(--muted);margin-top:2px;display:flex;justify-content:space-between;gap:6px}
.bar{display:flex;height:6px;border-radius:3px;overflow:hidden;background:var(--line2);margin-top:8px}
.bar i{display:block;height:100%}
.pill{font-size:11px;font-weight:700;border-radius:999px;padding:2px 8px;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.bad{background:var(--miss-soft);color:var(--miss)}
.pill.warn{background:var(--dup-soft);color:var(--dup)}
.pill.rev{background:var(--brand-soft);color:var(--brand)}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;margin:14px 8px 0;font-size:11px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:8px;height:8px;border-radius:2px;display:inline-block}

main{padding:22px 26px 60px;min-width:0}
.head{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.head h2{margin:0;font-size:30px;line-height:1.1;font-weight:800;letter-spacing:-.02em}
.head .meta{color:var(--muted);font-size:13px;margin-top:4px}
.head .actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}

.verdict{background:var(--panel);border:1px solid var(--line);border-left:5px solid var(--ok);border-radius:10px;padding:14px 18px;margin-bottom:18px;box-shadow:var(--shadow)}
.verdict.bad{border-left-color:var(--miss)} .verdict.warn{border-left-color:var(--dup)}
.verdict b{font-size:15px}
.verdict p{margin:4px 0 0;color:var(--muted);max-width:90ch}

/* ledger comparison */
.compare{display:grid;grid-template-columns:1fr 1fr 1.25fr;gap:12px;margin-bottom:18px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;box-shadow:var(--shadow);min-width:0}
.card .t{font-size:12px;color:var(--muted);font-weight:600}
.card .v{font-size:24px;font-weight:800;letter-spacing:-.01em;margin-top:4px}
.card .s{font-size:12px;color:var(--muted);margin-top:2px}
.bridge{font-size:13px}
.bridge .row{display:flex;justify-content:space-between;gap:10px;padding:3px 0}
.bridge .row.tot{border-top:1px solid var(--line);margin-top:4px;padding-top:6px;font-weight:700}
.bridge .sw{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px}

/* summary table */
.section-title{font-size:15px;font-weight:700;margin:22px 0 10px}
.tablewrap{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow-x:auto;box-shadow:var(--shadow)}
table{border-collapse:collapse;width:100%;font-size:13px}
th{position:sticky;top:0;background:var(--panel2);text-align:left;font-weight:600;color:var(--muted);font-size:12px;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid var(--line2);white-space:nowrap;max-width:280px;overflow:hidden;text-overflow:ellipsis}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--panel2)}
tfoot td{font-weight:700;background:var(--panel2);border-top:1px solid var(--line)}
.c-ok{color:var(--ok);font-weight:600} .c-dup{color:var(--dup);font-weight:600} .c-miss{color:var(--miss);font-weight:600} .c-only{color:var(--only);font-weight:600} .c-diff{color:var(--diff);font-weight:600}
.zero{color:var(--muted);opacity:.6}

/* tabs */
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:22px 0 10px}
.tab{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;display:inline-flex;gap:8px;align-items:center}
.tab .n{font-size:11px;border-radius:999px;padding:1px 7px;background:var(--line2)}
.tab[aria-selected="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.tab[aria-selected="true"] .n{background:rgba(255,255,255,.2)}
.tab .dot{width:8px;height:8px;border-radius:50%}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.search{flex:1;min-width:200px;height:36px;border:1px solid var(--line);border-radius:8px;background:var(--panel);padding:0 12px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--panel);height:34px;padding:0 12px;font-size:12px;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--brand-soft);color:var(--brand)}
.tabnote{font-size:13px;color:var(--muted);margin:0 0 10px;max-width:95ch}
.pager{display:flex;align-items:center;gap:8px;justify-content:flex-end;padding:10px;font-size:12px;color:var(--muted)}
.empty{padding:36px;text-align:center;color:var(--muted)}
.tag{font-size:11px;font-weight:700;border-radius:4px;padding:1px 6px}
.tag.matched{background:var(--ok-soft);color:var(--ok)} .tag.duplicate{background:var(--dup-soft);color:var(--dup)}
.tag.missing{background:var(--miss-soft);color:var(--miss)} .tag.onlyCoop{background:var(--only-soft);color:var(--only)} .tag.mismatch{background:var(--diff-soft);color:var(--diff)}

/* review */
.review{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-bottom:18px}
.review input[type=text]{flex:1;min-width:200px;height:34px;border:1px solid var(--line);border-radius:8px;background:var(--panel2);padding:0 10px}
.review label{display:flex;gap:6px;align-items:center;font-weight:600;font-size:13px}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(10,15,25,.35);z-index:40;display:none}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--panel);z-index:41;transform:translateX(100%);transition:transform .2s ease;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);border-left:1px solid var(--line)}
.drawer.open{transform:none} .scrim.open{display:block}
.drawer header{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.drawer header h3{margin:0;font-size:16px;margin-right:auto}
.drawer .body{overflow:auto;padding:16px 18px}
.kv{display:grid;grid-template-columns:140px 1fr;gap:4px 12px;font-size:13px;margin:8px 0 18px}
.kv dt{color:var(--muted)} .kv dd{margin:0;word-break:break-word;font-weight:500}
.drawer h4{margin:14px 0 6px;font-size:13px}
.post{border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-bottom:6px;font-size:13px;display:grid;grid-template-columns:1fr auto;gap:2px 10px}
.post.hl{border-color:var(--brand);box-shadow:0 0 0 1px var(--brand)}

/* loader */
dialog{border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--ink);padding:0;width:min(560px,94vw)}
dialog::backdrop{background:rgba(10,15,25,.4)}
dialog .db{padding:20px}
dialog h3{margin:0 0 4px;font-size:17px}
.drop{border:1.5px dashed var(--line);border-radius:10px;padding:14px;margin-top:12px;display:grid;gap:4px}
.drop b{font-size:13px} .drop small{color:var(--muted)}
.drop input{margin-top:6px}
.dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.err{color:var(--miss);font-size:13px;margin-top:10px;min-height:1em}

.files{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:stretch;margin-bottom:20px}
.fcard{background:var(--panel);border:1.5px solid var(--line);border-radius:12px;padding:14px 16px;display:grid;grid-template-columns:auto 1fr auto;gap:4px 14px;align-items:center;min-width:0;transition:border-color .15s}
.fcard.drag{border-color:var(--brand);border-style:dashed;background:var(--brand-soft)}
.fcard .fnum{grid-row:1/4;width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font-weight:800;font-size:16px;background:var(--brand-soft);color:var(--brand)}
.fcard .ft{font-size:12px;color:var(--muted);font-weight:600}
.fcard .fn{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fcard .fs{font-size:12px;color:var(--muted)}
.fcard .fb{grid-row:1/4;grid-column:3}
.fcard input[type=file]{position:absolute;width:1px;height:1px;opacity:0}
.vs{display:grid;place-items:center;font-weight:800;color:var(--muted);font-size:13px}
.side-n{background:color-mix(in srgb,var(--brand-soft) 45%,transparent)}
th.grp{text-align:center;font-size:11px;color:var(--ink);border-bottom:1px solid var(--line)}
@media (max-width:820px){.files{grid-template-columns:1fr}.vs{display:none}}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:10px 16px;border-radius:8px;font-size:13px;z-index:60;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}

@media (max-width:1100px){.compare{grid-template-columns:1fr 1fr}.compare .bridgecard{grid-column:1/-1}}
@media (max-width:820px){
  .shell{grid-template-columns:1fr}
  .rail{position:static;max-height:none;border-right:0;border-bottom:1px solid var(--line);display:flex;gap:8px;overflow-x:auto;padding:10px}
  .rail h2,.legend{display:none}
  .srow{min-width:170px;margin:0;background:var(--panel);border-color:var(--line)}
  main{padding:18px 14px 50px}
  .head h2{font-size:24px}
  .compare{grid-template-columns:1fr}
  .top{padding:10px 14px}
}
@media (prefers-reduced-motion:reduce){.drawer{transition:none}}
:root{--prob:#B4237A;--prob-soft:#FBE3F0}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--prob:#F07CBF;--prob-soft:#3A1B2E}}
:root[data-theme="dark"]{--prob:#F07CBF;--prob-soft:#3A1B2E}
.c-prob{color:var(--prob);font-weight:600}
.tag.onlyA{background:var(--miss-soft);color:var(--miss)} .tag.onlyB{background:var(--only-soft);color:var(--only)} .tag.probable{background:var(--prob-soft);color:var(--prob)}
.modes{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.mode{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:8px 14px;text-align:left;display:grid;gap:1px;min-width:190px}
.mode b{font-size:14px} .mode span{font-size:12px;color:var(--muted)}
.mode[aria-selected="true"]{border-color:var(--brand);box-shadow:0 0 0 1px var(--brand);background:var(--brand-soft)}
.subchip{display:inline-flex;align-items:center;gap:4px;font-size:14px;font-weight:600;background:var(--brand-soft);color:var(--brand);border-radius:999px;padding:3px 6px 3px 12px;vertical-align:middle}
.subchip button{border:0;background:transparent;color:inherit;font-size:16px;line-height:1;padding:0 4px}
tbody tr[data-s]{cursor:pointer}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><div class="mark" aria-hidden="true">RC</div><div style="min-width:0"><h1>Coop Reconciliation Portal</h1><p id="srcLine">Compare two files</p></div></div>
  <form class="lookup" id="lookupForm" autocomplete="off"><label for="lookupInput" id="lookupLabel">Session ID</label><input id="lookupInput" list="sessList"><datalist id="sessList"></datalist><button type="submit">Open</button></form>
  <button class="btn" id="loadBtn" type="button">Add files</button>
  <button class="btn" id="themeBtn" type="button" aria-label="Toggle colour theme">◐</button>
</header>
<div class="shell"><nav class="rail" id="rail" aria-label="Groups"></nav><main id="main"></main></div>
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-hidden="true"><header><h3 id="dTitle">Transaction</h3><button class="btn small" id="dClose" type="button">Close</button></header><div class="body" id="dBody"></div></aside>
<div class="toast" id="toast" role="status"></div>
<script type="application/json" id="seed">{}</script>
<script>(function(){
"use strict";
/* ================= helpers ================= */
const $=s=>document.querySelector(s);
const nf=new Intl.NumberFormat('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});
const nfi=new Intl.NumberFormat('en-IN');
const rs=v=>'Rs '+nf.format(v);
const rsSigned=v=>(v>0.004?'+':v<-0.004?'−':'')+'Rs '+nf.format(Math.abs(v));
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const r2=v=>Math.round(v*100)/100;
const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('show'),3200)};
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const pad=n=>String(n).padStart(2,'0');
const MON={jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,oct:10,nov:11,dec:12};
function adDate(v){
  if(v instanceof Date&&!isNaN(v))return `${v.getFullYear()}-${pad(v.getMonth()+1)}-${pad(v.getDate())}`;
  const s=String(v==null?'':v).trim();let m;
  if((m=s.match(/^(\d{1,2})-([A-Za-z]{3})-(\d{4})/)))return `${m[3]}-${pad(MON[m[2].toLowerCase()]||0)}-${pad(m[1])}`;
  if((m=s.match(/^(\d{4})-(\d{2})-(\d{2})/)))return `${m[1]}-${m[2]}-${m[3]}`;
  if((m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/)))return `${m[3]}-${pad(m[1])}-${pad(m[2])}`;
  return '';
}
function dtStr(v){
  if(v instanceof Date&&!isNaN(v))return adDate(v)+` ${pad(v.getHours())}:${pad(v.getMinutes())}:${pad(v.getSeconds())}`;
  const s=String(v==null?'':v).trim();const d=adDate(s);const tm=s.match(/(\d{1,2}:\d{2}(:\d{2})?)/);return d?(d+(tm?' '+tm[1]:'')):s;
}
const dayNum=ad=>{const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(ad||'');return m?Math.round(Date.UTC(+m[1],m[2]-1,+m[3])/864e5):null};
const fromDayNum=n=>{const d=new Date(n*864e5);return `${d.getUTCFullYear()}-${pad(d.getUTCMonth()+1)}-${pad(d.getUTCDate())}`};
const numv=v=>{if(typeof v==='number')return v;const s=String(v==null?'':v).replace(/,/g,'').trim();if(s===''||s==='-')return 0;const x=parseFloat(s);return isFinite(x)?x:NaN};
const norm=h=>String(h==null?'':h).trim().toLowerCase().replace(/[\s_.]+/g,' ').trim();
function findHeader(rows,must,not){for(let i=0;i<Math.min(rows.length,40);i++){const h=(rows[i]||[]).map(norm);if(must.every(m=>h.includes(m))&&!(not||[]).some(m=>h.includes(m)))return i}return -1}
const lc=s=>String(s).replace(/^[A-Z](?![A-Z])/,c=>c.toLowerCase());
const BSM=['Baisakh','Jestha','Asar','Shrawan','Bhadra','Ashwin','Kartik','Mangsir','Poush','Magh','Falgun','Chaitra'];

/* ================= file kinds ================= */
const KINDS={
  nicA:{p:'nic',side:'A',label:'NIC Asia settlement',test:r=>findHeader(r,['session number','initiator'])},
  nicB:{p:'nic',side:'B',label:'Coop session ledger',test:r=>findHeader(r,['reference','session id'])},
  giblA:{p:'gibl',side:'A',label:'Global IME bank statement',test:r=>findHeader(r,['description','withdraw','deposit'])},
  giblB:{p:'gibl',side:'B',label:'CBS GL statement',test:r=>findHeader(r,['reference','debit','credit'],['session id'])}
};
function detect(rows){for(const k of Object.keys(KINDS)){const h=KINDS[k].test(rows);if(h>=0)return {kind:k,hi:h}}return null}

/* ================= profiles ================= */
const COMMON_LABEL={side:'Side by side',matched:'Matched',probable:'Probable match',mismatch:'Amount differs'};
const P={};

/* ---------- NIC Asia vs Coop (session) ---------- */
P.nic={
  id:'nic',title:'NIC Asia ↔ Coop',aName:'NIC Asia settlement',bName:'Coop ledger',aShort:'NIC Asia',bShort:'Coop',
  groupWord:'Session',hasSub:false,hasBal:false,
  label:{...COMMON_LABEL,duplicate:'Duplicate postings',onlyA:'Missing in Coop',onlyB:'Only in Coop'},
  note:{
    side:'Every row of File 1 (NIC Asia) lined up with its row in File 2 (Coop). A dash means the row exists in only one file.',
    matched:'Paired one-to-one on session + initiator + settled amount.',
    duplicate:'Extra Coop vouchers for a transaction NIC Asia settled fewer times. These over-credit the member and are the likely reversal candidates.',
    onlyA:'Settled by NIC Asia but no Coop voucher found. The member has not been credited.',
    onlyB:'Posted in Coop with no NIC Asia settlement for the same session, initiator and amount.',
    mismatch:'Same session and initiator on both sides but amounts differ (within 10%). Check fees or manual edits.',
    probable:''
  },
  fieldsA:['id','t','tid','ini','ta','sa','fee','s','iss','tn','rrn','rm'],
  fieldsB:['bs','eng','v','ref','ini','amt','s','bal','ac','an','bk'],
  parseA(rows,hi){

    const c={id:ix('transaction id'),t:ix('transmission date'),tid:ix('terminal id'),ini:ix('initiator'),ta:ix('transaction amount'),sa:ix('settlement amount'),s:ix('session number'),iss:ix('issuer name'),tn:ix('terminal name'),rrn:ix('retrieval reference number'),rm:ix('remarks 1'),ps:ix('payment status')};
    if(c.ta<0)throw new Error('NIC file: TRANSACTION AMOUNT column not found.');
    const out=[];
    rows.slice(hi+1).forEach(r=>{
      if(c.ps>=0&&r[c.ps]&&!/success/i.test(r[c.ps]))return;
      const ta=numv(r[c.ta]);if(!isFinite(ta)||!ta||String(r[c.s]).trim()==='')return;
      let sa=c.sa>=0?numv(r[c.sa]):NaN;if(!isFinite(sa)||(c.sa>=0&&String(r[c.sa]).trim()==='N/A'))sa=ta;
      let ini=String(r[c.ini]==null?'':r[c.ini]).trim();if(!ini)ini='N/A';
      const rm=c.rm>=0?String(r[c.rm]).trim():'';
      out.push([String(r[c.id]),dtStr(r[c.t]),String(r[c.tid]||''),ini,r2(ta),r2(sa),r2(ta-sa),String(r[c.s]).trim(),String(r[c.iss]||''),String(r[c.tn]||'').trim(),String(r[c.rrn]||''),rm==='N/A'?'':rm]);
    });
    return out;
  },
  parseB(rows,hi){
    const H=rows[hi].map(norm),ix=n=>H.indexOf(n);
    const credits=H.map((h,i)=>h==='credit'?i:-1).filter(i=>i>=0);
    const c={bs:ix('date'),eng:ix('eng date'),v:ix('tran code'),ref:ix('reference'),ini:ix('initiator'),amt:ix('debit'),s:ix('session id'),bal:ix('balance'),ac:credits.length>1?credits[1]:-1,an:ix('account name')};
    if(c.amt<0)throw new Error('Coop file: Debit (amount) column not found.');
    const rx=/App Tran\s*:\s*(\S+)\s+QR-(.*)-(\d+)\s*$/i,out=[];
    rows.slice(hi+1).forEach(r=>{
      const amt=numv(r[c.amt]);if(!isFinite(amt)||!amt||String(r[c.s]).trim()==='')return;
      const ref=String(r[c.ref]||'').trim(),m=ref.match(rx);
      const ini=m?m[1]:(String(r[c.ini]||'').trim()||'N/A');
      out.push([String(r[c.bs]instanceof Date?adDate(r[c.bs]):r[c.bs]),adDate(r[c.eng]),String(r[c.v]),ref,ini,r2(amt),String(r[c.s]).trim(),numv(r[c.bal]),c.ac>=0?String(r[c.ac]):'',String(r[c.an]||'').trim(),m?m[2]:'']);
    });
    return out;
  },
  prepA(r){r.dir='in';r.amt=r.sa;r.g=r.s;r.date=r.t;r.ad=r.t.slice(0,10)},
  prepB(r){r.dir='in';r.g=r.s;r.date=r.bs;r.ad=r.eng},
  match(A,B){
    const key=(s,ini,a)=>s+'|'+ini+'|'+r2(a).toFixed(2);
    const aBy=new Map();
    A.forEach(r=>{r.k=key(r.s,r.ini,r.sa);if(!aBy.has(r.k))aBy.set(r.k,[]);aBy.get(r.k).push(r)});
    aBy.forEach(l=>l.sort((a,b)=>a.t<b.t?-1:a.t>b.t?1:0));
    const bBy=new Map();
    B.forEach(r=>{r.k=key(r.s,r.ini,r.amt);if(!bBy.has(r.k))bBy.set(r.k,[]);bBy.get(r.k).push(r)});
    bBy.forEach((list,k)=>{const al=aBy.get(k)||[];
      list.forEach((c,idx)=>{c.pos=idx+1;c.of=list.length;c.nt=al.length;
        if(idx<al.length){link(c,al[idx],'matched','Session + initiator + amount')}
        else if(al.length){c.st='duplicate';c.orig=list[0].i;c.pair=al[0].i;c.method='Repeat of '+list[0].v}});
    });
    const cand=new Map();
    B.forEach(c=>{if(!c.st&&c.ini!=='N/A'){const k2=c.s+'|'+c.ini;if(!cand.has(k2))cand.set(k2,[]);cand.get(k2).push(c)}});
    const used=new Set();
    A.forEach(n=>{if(n.st)return;const l=cand.get(n.s+'|'+n.ini);if(!l)return;let best=null,bd=Infinity;
      l.forEach(c=>{if(c.st||used.has(c.k))return;const d=Math.abs(c.amt-n.sa);if(d<bd){bd=d;best=c}});
      if(best&&bd<=Math.max(1,n.sa*0.10)){link(best,n,'mismatch','Session + initiator');used.add(best.k)}});
    B.forEach(c=>{if(c.st)return;const lead=bBy.get(c.k).find(x=>x.st==='mismatch');
      if(lead){c.st='duplicate';c.orig=lead.i;c.pair=lead.pair;c.method='Repeat of '+lead.v}else c.st='onlyB'});
    A.forEach(n=>{if(!n.st)n.st='onlyA'});
  },
  groupLabel:g=>'Session '+g, groupSort:(a,b)=>(+a)-(+b)||String(a).localeCompare(b),
  railSub:x=>x.first?x.first.slice(0,10):'',
  cols(tab,pa){
    const T=(h,f,t,s)=>({h,f,t,s});
    return ({
      side:[T('Session',r=>r.g),T('Result',r=>r.st,'tag'),
        T('Txn ID',r=>r.a?r.a.id:'',0,1),T('Time',r=>r.a?r.a.t:'',0,1),T('Initiator',r=>r.a?r.a.ini:'',0,1),T('Merchant',r=>r.a?r.a.tn:'',0,1),T('Settled',r=>r.a?r.a.sa:'','n',1),
        T('Voucher',r=>r.b?r.b.v:'',0,2),T('Initiator',r=>r.b?r.b.ini:'',0,2),T('Account name',r=>r.b?r.b.an:'',0,2),T('Amount',r=>r.b?r.b.amt:'','n',2),
        T('Difference',r=>r.diff,'nd')],
      matched:[T('Session',r=>r.s),T('NIC txn ID',r=>pa(r).id),T('NIC time',r=>pa(r).t),T('Initiator',r=>r.ini),T('Issuer',r=>pa(r).iss),T('Merchant terminal',r=>pa(r).tn),T('NIC amount',r=>pa(r).ta,'n'),T('Fee',r=>pa(r).fee,'n'),T('Settled',r=>pa(r).sa,'n'),T('Coop voucher',r=>r.v),T('Account',r=>r.ac),T('Account name',r=>r.an),T('Coop amount',r=>r.amt,'n')],
      duplicate:[T('Session',r=>r.s),T('Coop voucher',r=>r.v),T('Posting',r=>r.pos+' of '+r.of),T('BS date',r=>r.bs),T('Initiator',r=>r.ini),T('Bank',r=>r.bk),T('Account',r=>r.ac),T('Account name',r=>r.an),T('Amount',r=>r.amt,'n'),T('First voucher',r=>r.method.replace('Repeat of ','')),T('NIC txn ID',r=>r.pair>=0?pa(r).id:''),T('Times settled by NIC',r=>r.nt,'n0')],
      onlyA:[T('Session',r=>r.s),T('NIC txn ID',r=>r.id),T('Time',r=>r.t),T('Initiator',r=>r.ini),T('Issuer',r=>r.iss),T('Merchant terminal',r=>r.tn),T('Terminal ID',r=>r.tid),T('RRN',r=>r.rrn),T('Amount',r=>r.ta,'n'),T('Fee',r=>r.fee,'n'),T('Settled',r=>r.sa,'n'),T('Remarks',r=>r.rm)],
      onlyB:[T('Session',r=>r.s),T('Coop voucher',r=>r.v),T('BS date',r=>r.bs),T('Eng date',r=>r.eng),T('Initiator',r=>r.ini),T('Bank',r=>r.bk),T('Account',r=>r.ac),T('Account name',r=>r.an),T('Amount',r=>r.amt,'n'),T('Reference',r=>r.ref)],
      mismatch:[T('Session',r=>r.s),T('Coop voucher',r=>r.v),T('Initiator',r=>r.ini),T('Account name',r=>r.an),T('Coop amount',r=>r.amt,'n'),T('NIC txn ID',r=>pa(r).id),T('NIC amount',r=>pa(r).ta,'n'),T('NIC settled',r=>pa(r).sa,'n'),T('Difference',r=>r2(r.amt-pa(r).sa),'nd'),T('Merchant terminal',r=>pa(r).tn)],
      probable:[]
    })[tab];
  },
  aggs:{duplicate:{label:'By member account',key:r=>r.ac+'|'+r.an,cols:[['Account','ac'],['Account name','an']],filter:r=>r.ac||r.an}},
  detailA:n=>[['Transaction ID',n.id],['Time',n.t],['Session',n.s],['Initiator',n.ini],['Issuer',n.iss],['Merchant terminal',n.tn],['Terminal ID',n.tid],['RRN',n.rrn],['Amount',rs(n.ta)],['Fee',rs(n.fee)],['Settled',rs(n.sa)],['Remarks',n.rm||'—']],
  cardB:c=>({title:c.v,sub:`${c.bs} · ${c.ac} ${c.an}`,ref:c.ref,amt:c.amt,bal:c.bal}),
  noteA(n,A){const same=A.filter(z=>z.k===n.k);return same.length>1?`NIC Asia settled this same session, initiator and amount ${same.length} times.`:''},
  titleA:n=>'NIC txn '+n.id, titleB:c=>'Voucher '+c.v
};

/* ---------- Global IME bank vs CBS GL ---------- */
function bankInfo(r){
  const d=r.desc||'',rem=r.rem||'';let m;
  r.id='';r.mid='';r.tok='';r.name='';r.cat='Other';
  if((m=d.match(/^ACQ_SETTL-([^/]+)\/([^/]*)\/?(.*)$/))){r.id=m[1];r.mid=m[2];r.name=m[3];r.cat='QR settlement (ACQ_SETTL)'}
  else if((m=d.match(/^SCT\/[^/]*\/(\S+)/))){r.id=m[1];r.cat='SCT transfer out';const n=rem.split('/');r.name=n.slice(1).join('/').trim()}
  else if(/^SI FROM/i.test(d))r.cat='Sweep in (SI FROM)';
  else if(/^SI TO/i.test(d))r.cat='Sweep out (SI TO)';
  else if(/^REVFEE/i.test(d))r.cat='Reversal fee';
  else if(/^REV/i.test(d))r.cat='Reversal';
  else if(/^TRRR/i.test(d))r.cat='TRRR credit';
  else if(/^FPS:/i.test(d))r.cat='FPS / IBFT';
  else if(/^WD:/i.test(d))r.cat='WD credit';
  const parts=rem.split('/');
  if(r.cat.startsWith('QR')&&parts.length>1){let t=parts[1].trim().replace(/^\+977-?/,'');if(t.length>=8&&!/^0+$/.test(t))r.tok=t}
}
function cbsInfo(r){
  const f=r.ref||'';let m;
  r.toks=new Set((f.match(/[A-Za-z0-9_\-+]{8,}/g)||[]).map(t=>t.replace(/^\+977-?/,'')));
  r.name='';r.cat='Other';
  if(/SCT_LOAD/i.test(f)){r.cat=/SCT_LOAD\s*to\b/i.test(f)?'SCT_LOAD to account':'QR load (SCT_LOAD)';const p=f.split('|');if(p.length>2)r.name=p[p.length-1].trim()}
  else if((m=f.match(/^App Tran\s*:\s*\S+\s+(.+?)\s+-\s+(.+?)\s+-\s+/))){r.cat='Transfer out ('+m[1].replace(/\s+LIMITED$/i,'').trim()+')';r.name=m[2].trim();r.catShort='Transfer out'}
  else if(/opening bal/i.test(f))r.cat='Opening balance';
  else if(/SCT LOAD|Complete For/i.test(f))r.cat='SCT load (other)';
  else if(/IBT/i.test(f))r.cat='IBT transfer';
  else if(/reversed/i.test(f))r.cat='Reversal';
  else if(/balance transfer|trf fro?m/i.test(f))r.cat='Fund transfer';
  if(r.cat.startsWith('Transfer out ('))r.catG='Transfer out (bank payment)';else r.catG=r.cat;
}
function buildCalendar(B,pairs){
  // month lengths inferred from CBS dates; anchored with matched pairs
  const ml=new Map();
  B.forEach(r=>{const m=/^(\d{4})\/(\d{2})\/(\d{2})/.exec(r.bs);if(m){const k=m[1]+'/'+m[2];ml.set(k,Math.max(ml.get(k)||0,+m[3]))}});
  const months=[...ml.keys()].sort();
  if(!months.length)return null;
  // extend 3 months either side at 30 days
  const nextM=k=>{let [y,m]=k.split('/').map(Number);m++;if(m>12){m=1;y++}return y+'/'+pad(m)};
  const prevM=k=>{let [y,m]=k.split('/').map(Number);m--;if(m<1){m=12;y--}return y+'/'+pad(m)};
  let first=months[0],last=months[months.length-1];
  for(let i=0;i<4;i++){first=prevM(first);ml.set(first,30);last=nextM(last);ml.set(last,30)}
  const all=[...ml.keys()].sort();const start=new Map();let acc=0;all.forEach(k=>{start.set(k,acc);acc+=ml.get(k)});
  const idx=bs=>{const m=/^(\d{4})\/(\d{2})\/(\d{2})/.exec(bs||'');if(!m)return null;const s=start.get(m[1]+'/'+m[2]);return s==null?null:s+ +m[3]-1};
  const cnt=new Map();pairs.forEach(([bs,ad])=>{const a=idx(bs),b=dayNum(ad);if(a==null||b==null)return;const o=b-a;cnt.set(o,(cnt.get(o)||0)+1)});
  let off=null,best=0;cnt.forEach((v,k)=>{if(v>best){best=v;off=k}});
  if(off==null){const a=idx('2083/01/01');if(a!=null)off=dayNum('2026-04-14')-a}
  if(off==null)return null;
  const direct=new Map(),inv=new Map();
  const c1=new Map(),c2=new Map();
  pairs.forEach(([bs,ad])=>{const k1=bs+'>'+ad;c1.set(k1,(c1.get(k1)||0)+1)});
  c1.forEach((v,k)=>{const [bs,ad]=k.split('>');if(!direct.has(bs)||v>direct.get(bs).v)direct.set(bs,{ad,v});if(!inv.has(ad)||v>inv.get(ad).v)inv.set(ad,{bs,v})});
  return {
    toAd:bs=>{const d=direct.get(bs);if(d)return d.ad;const i=idx(bs);return i==null?'':fromDayNum(i+off)},
    toBs:ad=>{const d=inv.get(ad);if(d)return d.bs;const n=dayNum(ad);if(n==null)return '';let i=n-off;for(const k of all){const L=ml.get(k);if(i<start.get(k)+L&&i>=start.get(k))return k+'/'+pad(i-start.get(k)+1)}return ''}
  };
}
P.gibl={
  id:'gibl',title:'Global IME ↔ CBS',aName:'Global IME bank statement',bName:'CBS GL (bank account in Coop books)',aShort:'Bank',bShort:'CBS',
  groupWord:'Month',hasSub:true,hasBal:true,
  label:{...COMMON_LABEL,duplicate:'Duplicate in CBS',onlyA:'Only in bank',onlyB:'Only in CBS'},
  note:{
    side:'Every bank statement row (File 1) lined up with its CBS GL row (File 2). Bank deposits pair with CBS debits, bank withdrawals with CBS credits. A dash means the row is in only one file.',
    matched:'Paired on the transaction ID or the phone / reference number that appears in both files, with the same amount and direction.',
    probable:'No shared ID, but the same amount and direction within one day. Tick through these to confirm.',
    duplicate:'CBS posted the same bank transaction ID more than once.',
    onlyA:'In the bank statement with no CBS entry. Daily sweeps (SI FROM / SI TO) are normally expected here; QR settlements here mean a member was not credited.',
    onlyB:'In CBS with no bank statement row. Entries before the bank statement starts will always land here.',
    mismatch:'Same transaction ID on both sides but the amounts differ.'
  },
  fieldsA:['sn','td','vd','desc','rem','dir','amt','bal'],
  fieldsB:['sn','bs','ref','dir','amt','bal'],
  parseA(rows,hi){
    const H=rows[hi].map(norm),ix=n=>H.indexOf(n);
    const c={sn:ix('s n')>=0?ix('s n'):ix('sn'),td:ix('transaction date'),vd:ix('value date'),desc:ix('description'),rem:ix('remarks'),w:ix('withdraw'),d:ix('deposit'),bal:ix('balance')};
    const out=[];
    rows.slice(hi+1).forEach(r=>{
      const w=numv(r[c.w]),d=numv(r[c.d]);
      if(!(w>0)&&!(d>0))return;
      out.push([String(r[c.sn]==null?'':r[c.sn]),adDate(r[c.td])||adDate(r[c.vd]),c.vd>=0?dtStr(r[c.vd]):'',String(r[c.desc]||'').trim(),c.rem>=0?String(r[c.rem]||'').trim():'',d>0?'in':'out',r2(d>0?d:w),numv(r[c.bal])]);
    });
    return out;
  },
  parseB(rows,hi){
    const H=rows[hi].map(norm),ix=n=>H.indexOf(n);
    const c={sn:ix('sn')>=0?ix('sn'):ix('s n'),bs:ix('date'),ref:ix('reference'),dr:ix('debit'),cr:ix('credit'),bal:ix('balance')};
    const out=[];
    rows.slice(hi+1).forEach(r=>{
      const dr=numv(r[c.dr]),cr=numv(r[c.cr]);
      if(!(dr>0)&&!(cr>0))return;
      if(/^total$/i.test(String(r[c.ref]||'').trim()))return;
      out.push([String(r[c.sn]==null?'':r[c.sn]),String(r[c.bs]instanceof Date?adDate(r[c.bs]):(r[c.bs]||'')).trim(),String(r[c.ref]||'').trim(),dr>0?'in':'out',r2(dr>0?dr:cr),numv(r[c.bal])]);
    });
    return out;
  },
  prepA(r){bankInfo(r);r.ad=r.td;r.date=r.td},
  prepB(r){cbsInfo(r);r.date=r.bs},
  match(A,B,ctx){
    // pass 1: transaction ID
    const byId=new Map();A.forEach(a=>{if(a.id)byId.set(a.id+'|'+a.dir,a)});
    B.forEach(b=>{
      for(const t of b.toks){const a=byId.get(t+'|'+b.dir);if(!a)continue;
        if(a.st==='matched'||a.st==='mismatch'){const first=B[a.pair];if(first&&first!==b&&Math.abs(a.amt-b.amt)<0.005){b.st='duplicate';b.pair=a.i;b.orig=first.i;b.method='Same ID as CBS SN '+first.sn;break}continue}
        link(b,a,Math.abs(a.amt-b.amt)<0.005?'matched':'mismatch','Transaction ID');break}
    });
    const pairs=[];B.forEach(b=>{if(b.st==='matched')pairs.push([b.bs,A[b.pair].td])});
    const cal=buildCalendar(B,pairs);ctx.cal=cal;
    B.forEach(b=>{b.ad=cal?cal.toAd(b.bs):''});
    // pass 2: phone / reference token, same amount + dir, nearest date
    const byTok=new Map();A.forEach(a=>{if(!a.st&&a.tok){const k=a.tok+'|'+a.dir+'|'+a.amt.toFixed(2);if(!byTok.has(k))byTok.set(k,[]);byTok.get(k).push(a)}});
    B.forEach(b=>{if(b.st)return;const bd=dayNum(b.ad);
      for(const t of b.toks){const l=byTok.get(t+'|'+b.dir+'|'+b.amt.toFixed(2));if(!l)continue;
        let best=null,gap=Infinity;l.forEach(a=>{if(a.st)return;const g=bd==null?0:Math.abs(dayNum(a.td)-bd);if(g<gap){gap=g;best=a}});
        if(best&&gap<=5){link(b,best,'matched','Phone / reference');b.gap=best.gap=gap;break}}
    });
    // pass 2b: bulk settlements (one bank credit = a day's CBS QR loads)
    if(cal){
      const qd=new Map();B.forEach(b=>{if(!b.st&&b.dir==='in'&&/QR load|SCT load/.test(b.cat)){const d=dayNum(b.ad);if(d==null)return;if(!qd.has(d))qd.set(d,[]);qd.get(d).push(b)}});
      const wins=[[-1],[0],[-2],[-2,-1],[-3,-2,-1],[-1,0]];
      A.filter(a=>!a.st&&a.dir==='in'&&/smart choice/i.test(a.desc)).sort((x,y)=>x.td<y.td?-1:1).forEach(a=>{const d=dayNum(a.td);
        for(const w of wins){const mem=[];w.forEach(o=>(qd.get(d+o)||[]).forEach(b=>{if(!b.st)mem.push(b)}));if(!mem.length)continue;
          const s=r2(mem.reduce((x,b)=>x+b.amt,0));
          if(Math.abs(s-a.amt)<0.01){a.st='matched';a.method='Daily batch ('+mem.length+' CBS rows)';a.batch=mem.length;a.pair=mem[0].i;
            mem.forEach(b=>{b.st='matched';b.pair=a.i;b.batch=true;b.method='In daily batch, bank S.N '+a.sn});break}}});
    }
    // pass 3: amount + direction within 1 day (probable)
    if(cal){
      const byAmt=new Map();A.forEach(a=>{if(!a.st&&a.cat!=='Sweep in (SI FROM)'&&a.cat!=='Sweep out (SI TO)'){const k=a.dir+'|'+a.amt.toFixed(2)+'|'+dayNum(a.td);if(!byAmt.has(k))byAmt.set(k,[]);byAmt.get(k).push(a)}});
      B.forEach(b=>{if(b.st||b.cat==='Opening balance')return;const bd=dayNum(b.ad);if(bd==null)return;
        for(const g of [0,1,-1]){const l=byAmt.get(b.dir+'|'+b.amt.toFixed(2)+'|'+(bd+g));const a=l&&l.find(x=>!x.st);if(a){link(b,a,'probable','Amount + date');b.gap=a.gap=Math.abs(g);break}}
      });
    }
    // pass 4: large non-QR amounts within 7 days (probable)
    if(cal){const big=A.filter(a=>!a.st&&a.amt>=100000&&!/Sweep/.test(a.cat));
      B.forEach(b=>{if(b.st||b.amt<100000||b.cat==='Opening balance')return;const bd=dayNum(b.ad);if(bd==null)return;
        let best=null,gap=99;big.forEach(a=>{if(a.st||a.dir!==b.dir||Math.abs(a.amt-b.amt)>0.005)return;const g=Math.abs(dayNum(a.td)-bd);if(g<=7&&g<gap){gap=g;best=a}});
        if(best){link(b,best,'probable','Same large amount within '+gap+' day'+(gap===1?'':'s'));b.gap=best.gap=gap}});}
    A.forEach(a=>{if(!a.st)a.st='onlyA'});B.forEach(b=>{if(!b.st)b.st='onlyB'});
    // groups: BS month / day

      probable:[T('BS date',r=>r.bs),T('Bank date',r=>pa(r).td),T('Days apart',r=>r.gap,'n0'),T('Direction',r=>dirL(r.dir)),T('Amount',r=>r.amt,'n'),T('Bank description',r=>pa(r).desc),T('Bank remarks',r=>pa(r).rem),T('CBS SN',r=>r.sn),T('CBS reference',r=>r.ref)],

      onlyA:[T('BS date (est.)',r=>r.bs),T('Bank date',r=>r.td),T('Value date',r=>r.vd),T('Type',r=>r.cat),T('Direction',r=>dirL(r.dir)),T('Amount',r=>r.amt,'n'),T('Description',r=>r.desc),T('Remarks',r=>r.rem),T('Balance',r=>r.bal,'n')],

function link(b,a,st,method){b.st=st;a.st=st;b.pair=a.i;a.pair=b.i;b.method=a.method=method}

/* ================= state ================= */
const DS={nic:{A:null,B:null},gibl:{A:null,B:null}}; // {name, rows(raw arrays)}

const savedTheme=store.get('recon-theme',null);if(savedTheme)document.documentElement.dataset.theme=savedTheme;
$('#themeBtn').onclick=()=>{const c=document.documentElement.dataset.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');const n=c==='dark'?'light':'dark';document.documentElement.dataset.theme=n;store.set('recon-theme',n)};

function unpack(fields,rows,side){return rows.map((a,i)=>{const o={i,side,st:null,pair:-1,orig:-1,method:'',gap:null};fields.forEach((f,j)=>o[f]=a[j]);return o})}

function reconcile(){
  const p=P[cur],ds=DS[cur];
  if(!ds.A||!ds.B){D=null;S=null;GROUPS=[];return}
  const A=unpack(p.fieldsA,ds.A.rows,'A'),B=unpack(p.fieldsB,ds.B.rows,'B');
  A.forEach(r=>p.prepA(r));B.forEach(r=>p.prepB(r));
  const ctx={};p.match(A,B,ctx);
  D={A,B,p,ctx};
  S=new Map();
  const sm=()=>({nA:0,nB:0,aIn:0,aOut:0,bIn:0,bOut:0,cA:{},cB:{},mA:{},mB:{},first:null,last:null,subs:null});
  const add=(x,r,side)=>{const s=r.dir==='in'?r.amt:-r.amt;
    if(side==='A'){x.nA++;if(r.dir==='in')x.aIn+=r.amt;else x.aOut+=r.amt;x.cA[r.st]=(x.cA[r.st]||0)+1;x.mA[r.st]=(x.mA[r.st]||0)+s}
    else{x.nB++;if(r.dir==='in')x.bIn+=r.amt;else x.bOut+=r.amt;x.cB[r.st]=(x.cB[r.st]||0)+1;x.mB[r.st]=(x.mB[r.st]||0)+s}
    if(r.ad){if(!x.first||r.ad<x.first)x.first=r.ad;if(!x.last||r.ad>x.last)x.last=r.ad}};
  const tot=sm();
  const put=(r,side)=>{if(!S.has(r.g))S.set(r.g,sm());const x=S.get(r.g);add(x,r,side);add(tot,r,side);
    if(p.hasSub){x.subs=x.subs||new Map();if(!x.subs.has(r.sub))x.subs.set(r.sub,sm());add(x.subs.get(r.sub),r,side)}};
  A.forEach(r=>put(r,'A'));B.forEach(r=>put(r,'B'));
  const fin=x=>{x.aNet=r2(x.aIn-x.aOut);x.bNet=r2(x.bIn-x.bOut);x.diff=r2(x.bNet-x.aNet);
    const c=k=>(x.cA[k]||0)+(k==='onlyA'?0:0);
    x.n={matched:x.cB.matched||0,probable:x.cB.probable||0,mismatch:x.cB.mismatch||0,duplicate:x.cB.duplicate||0,onlyA:x.cA.onlyA||0,onlyB:x.cB.onlyB||0};
    x.n.side=x.nA+x.n.duplicate+x.n.onlyB;
    x.issues=x.n.duplicate+x.n.onlyA+x.n.onlyB+x.n.mismatch;
    x.amt={duplicate:x.mB.duplicate||0,onlyA:x.mA.onlyA||0,onlyB:x.mB.onlyB||0,mismatch:r2((x.mB.mismatch||0)-(x.mA.mismatch||0)),probable:r2((x.mB.probable||0)-(x.mA.probable||0))};
    if(x.subs)x.subs.forEach(fin)};
  S.forEach(fin);fin(tot);S.total=tot;
  GROUPS=[...S.keys()].sort(p.groupSort);
  if(p.hasBal){
    const lastBal=(arr,cmp)=>{let best=null;arr.forEach(r=>{if(isFinite(r.bal)&&(best==null||cmp(r,best)>0))best=r});return best};
    const la=lastBal(A,(x,y)=>(+x.sn||0)-(+y.sn||0)),lb=lastBal(B,(x,y)=>(+x.sn||0)-(+y.sn||0));
    tot.closeA=la?la.bal:null;tot.closeB=lb?lb.bal:null;tot.closeAd=la?la.td:'';tot.closeBs=lb?lb.bs:'';
  }
}

/* ================= rendering ================= */
const COL={side:'var(--brand)',matched:'var(--ok)',probable:'var(--prob)',duplicate:'var(--dup)',onlyA:'var(--miss)',onlyB:'var(--only)',mismatch:'var(--diff)'};
function statusOf(x){
  if(!x.nA)return {cls:'bad',txt:'No '+D.p.aShort+' rows'};
  if(!x.nB)return {cls:'bad',txt:'No '+D.p.bShort+' rows'};
  if(x.issues===0&&!x.n.probable)return {cls:'ok',txt:'Balanced'};
  if(x.issues===0)return {cls:'warn',txt:x.n.probable+' to confirm'};
  if(x.n.onlyA||x.n.onlyB||x.n.mismatch)return {cls:'bad',txt:nfi.format(x.issues)+' issues'};
  return {cls:'warn',txt:nfi.format(x.n.duplicate)+' dup.'};
}
function barHTML(x){
  const t=x.nB+x.n.onlyA||1;const seg=(n,c)=>n?`<i style="width:${(n/t*100).toFixed(2)}%;background:${c}"></i>`:'';
  return `<div class="bar" aria-hidden="true">${seg(x.n.matched,COL.matched)}${seg(x.n.probable,COL.probable)}${seg(x.n.mismatch,COL.mismatch)}${seg(x.n.duplicate,COL.duplicate)}${seg(x.n.onlyB,COL.onlyB)}${seg(x.n.onlyA,COL.onlyA)}</div>`;
}
function modesHTML(){
  return `<div class="modes" role="tablist" aria-label="Comparison">${Object.values(P).map(p=>{const ds=DS[p.id];const st=ds.A&&ds.B?'Both files loaded':ds.A||ds.B?'1 of 2 files':'No files';
    return `<button class="mode" role="tab" data-p="${p.id}" aria-selected="${cur===p.id}"><b>${esc(p.title)}</b><span>${st}</span></button>`}).join('')}</div>`;
}
function filesHTML(){
  const p=P[cur],ds=DS[cur];
  const sums=(rows,fields)=>{if(!rows)return null;const di=fields.indexOf('dir'),ai=fields.indexOf(cur==='nic'?(fields.includes('sa')?'sa':'amt'):'amt');let i=0,o=0;rows.forEach(r=>{const a=+r[ai]||0;if(di>=0&&r[di]==='out')o+=a;else i+=a});return {i,o}};
  const card=(side,n,title)=>{const f=ds[side];const s=f&&sums(f.rows,side==='A'?p.fieldsA:p.fieldsB);
    return `<div class="fcard" data-side="${side}"><div class="fnum">${n}</div><div class="ft">${title}</div><div class="fn" title="${esc(f?f.name:'')}">${esc(f?f.name:'No file yet')}</div><div class="fs">${f?nfi.format(f.rows.length)+' rows · in '+nf.format(s.i)+(s.o?' · out '+nf.format(s.o):''):'Drop a file here or choose one'}</div><label class="btn small fb">${f?'Replace file':'Choose file'}<input type="file" accept=".xlsx,.xls,.csv" data-side="${side}"></label></div>`};
  return `<div class="files">${card('A',1,'File 1 · '+p.aName)}<div class="vs">vs</div>${card('B',2,'File 2 · '+p.bName)}</div>`;
}
function renderRail(){
  if(!D){$('#rail').innerHTML=`<h2>${P[cur].groupWord}s</h2><p class="muted" style="margin:0 8px;font-size:13px">${P[cur].groupWord}s appear here once both files are loaded.</p>`;$('#sessList').innerHTML='';return}
  const t=S.total,p=D.p;
  let h=`<h2>${p.groupWord}s</h2>`;
  const row=(g,label,x,sub)=>{const st=statusOf(x),rv=g!=null&&reviews[rvKey(g)]&&reviews[rvKey(g)].done;
    return `<button class="srow" data-g="${g==null?'':esc(g)}" aria-current="${view.g===g}"><div class="l1"><span class="sid">${esc(label)}</span><span style="display:flex;gap:4px">${rv?'<span class="pill rev">Reviewed</span>':''}<span class="pill ${st.cls}">${st.txt}</span></span></div><div class="sub"><span>${esc(sub)}</span><span class="${Math.abs(x.diff)>0.004?'c-miss':''}">${rsSigned(x.diff)}</span></div>${barHTML(x)}</button>`};
  h+=row(null,'All '+p.groupWord.toLowerCase()+'s',t,GROUPS.length+' '+p.groupWord.toLowerCase()+'s');

  h+=`<div class="legend">${['matched','probable','mismatch','duplicate','onlyB','onlyA'].map(k=>`<span><i style="background:${COL[k]}"></i>${p.label[k]}</span>`).join('')}</div>`;
  $('#rail').innerHTML=h;
  $('#rail').querySelectorAll('.srow').forEach(b=>b.onclick=()=>openGroup(b.dataset.g===''?null:b.dataset.g));
  $('#sessList').innerHTML=GROUPS.map(g=>`<option value="${esc(g)}">`).join('');

}
function openGroup(g,sub){view.g=g;view.sub=sub||null;view.page=0;view.q='';view.agg=false;renderRail();renderMain();window.scrollTo({top:0})}

function scopeX(){if(!D)return null;if(view.g==null)return S.total;const x=S.get(view.g);if(view.sub&&x.subs)return x.subs.get(view.sub)||x;return x}
const inScope=r=>(view.g==null||r.g===view.g)&&(!view.sub||r.sub===view.sub);
function rowsFor(tab){
  const {A,B}=D;
  if(tab==='onlyA')return A.filter(r=>inScope(r)&&r.st==='onlyA');
  if(tab==='side'){
    const out=[];const ord={matched:0,probable:1,mismatch:2,duplicate:3,onlyA:4,onlyB:5};
    A.forEach(a=>{if(!inScope(a))return;if(a.batch){out.push({g:a.g,sub:a.sub||a.g,st:a.st,a,b:null,method:a.method,diff:0});return}const b=a.pair>=0?B[a.pair]:null;out.push({g:a.g,sub:a.sub||a.g,st:a.st,a,b,method:a.method,diff:r2((b?(b.dir==='in'?b.amt:-b.amt):0)-(a.dir==='in'?a.amt:-a.amt))})});
    B.forEach(b=>{if(b.batch&&inScope(b)){out.push({g:b.g,sub:b.sub||b.g,st:b.st,a:null,b,method:b.method,diff:0});return}if(!inScope(b)||(b.st!=='duplicate'&&b.st!=='onlyB'))return;out.push({g:b.g,sub:b.sub||b.g,st:b.st,a:null,b,method:b.method,diff:b.dir==='in'?b.amt:-b.amt,dupOf:b.pair})});
    const sk=r=>{const x=r.a||r.b;return (cur==='nic'?String(x.g).padStart(8,'0')+'|'+x.ini+'|'+String(x.amt).padStart(12,'0'):(r.sub||'')+'|'+String(r.a?r.a.sn:'').padStart(8,'0')+'|'+String(r.b?r.b.sn:'').padStart(8,'0'))};
    out.forEach(r=>r.sk=sk(r));
    out.sort((x,y)=>x.sk<y.sk?-1:x.sk>y.sk?1:(ord[x.st]-ord[y.st]));
    return view.sideMode==='diff'?out.filter(r=>r.st!=='matched'):out;
  }
  return B.filter(r=>inScope(r)&&r.st===tab);
}
function aggRows(tab,rows){
  const ag=D.p.aggs[tab];const m=new Map();
  rows.forEach(r=>{if(ag.filter&&!ag.filter(r))return;const k=ag.key(r);if(!m.has(k))m.set(k,{r,n:0,amt:0,gs:new Set()});const x=m.get(k);x.n++;x.amt+=r.amt;x.gs.add(r.g)});
  return [...m.values()].map(x=>{const o={n:x.n,amt:r2(x.amt),gs:[...x.gs].sort().join(', ')};ag.cols.forEach(([h,f])=>o[f]=x.r[f]);return o}).sort((a,b)=>b.amt-a.amt);
}
function currentList(){
  const p=D.p;const pa=r=>D.A[r.pair]||{};
  let rows=rowsFor(view.tab),cols=p.cols(view.tab,pa),agg=false;
  if(view.agg&&p.aggs[view.tab]){rows=aggRows(view.tab,rows);agg=true;
    cols=p.aggs[view.tab].cols.map(([h,f])=>({h,f:r=>f==='dir'?(r[f]==='in'?'In':'Out'):r[f]})).concat([{h:p.groupWord+'s',f:r=>r.gs},{h:'Rows',f:r=>r.n,t:'n0'},{h:'Amount',f:r=>r.amt,t:'n'}])}
  const q=view.q.trim().toLowerCase();
  if(q)rows=rows.filter(r=>cols.some(c=>{const v=c.f(r);return String(c.t==='tag'?p.label[v]:v).toLowerCase().includes(q)}));
  return {rows,cols,agg};
}
const fmtCell=(v,t)=>{if(v===''||v==null)return t&&t[0]==='n'?'—':'';if(t==='n'||t==='nd')return nf.format(v||0);if(t==='n0')return nfi.format(v||0);return v};

function renderMain(){
  const main=$('#main');
  let h=modesHTML()+filesHTML();

    const ds=DS[cur],p=P[cur];
    h+=`<div class="verdict warn"><b>Add both files to start the ${esc(p.title)} comparison.</b><p>File 1 is the ${esc(p.aName)}, File 2 is the ${esc(p.bName)}. ${ds.A?'File 1 is loaded.':ds.B?'File 2 is loaded.':'Nothing is loaded yet.'} Drop any supported export on either card; the portal recognises the file type and puts it in the right comparison. Files are read in your browser and never uploaded.</p></div>`;
    main.innerHTML=h;wireTop();return;
  }
  const p=D.p,x=scopeX(),g=view.g;
  const title=g==null?'All '+p.groupWord.toLowerCase()+'s':p.groupLabel(g);
  const meta=[x.first?`AD ${x.first} to ${x.last}`:'',g!=null&&!p.hasSub?'':'' ].filter(Boolean).join(' · ');
  h+=`<div class="head"><div><h2>${esc(title)}${view.sub?` <span class="subchip">${esc(view.sub)} <button type="button" id="clrSub" aria-label="Show whole month">×</button></span>`:''}</h2><div class="meta">${esc(meta)}</div></div><div class="actions"><button class="btn" id="xlsxBtn" type="button">Export Excel report</button></div></div>`;

  // verdict
  const vcls=x.issues===0?(x.n.probable?'warn':''):((x.n.onlyA||x.n.onlyB||x.n.mismatch)?'bad':'warn');
  const found=x.nA-x.n.onlyA;
  let vt=x.issues===0&&!x.n.probable?`Balanced. All ${nfi.format(x.nA)} ${p.aShort} rows match ${p.bShort} one-to-one.`:
    `${nfi.format(x.n.matched)} of ${nfi.format(x.nA)} ${p.aShort} rows matched in ${p.bShort}${x.n.probable?` and ${nfi.format(x.n.probable)} more are probable`:''}. Net movement differs by ${rs(Math.abs(x.diff))} (${p.bShort} ${x.diff>=0?'higher':'lower'}).`;
  const parts=[];
  if(x.n.duplicate)parts.push(`${nfi.format(x.n.duplicate)} ${lc(p.label.duplicate)} (${rs(Math.abs(x.amt.duplicate))})`);
  if(x.n.onlyA)parts.push(`${nfi.format(x.n.onlyA)} ${lc(p.label.onlyA)} (net ${rsSigned(x.amt.onlyA)})`);
  if(x.n.onlyB)parts.push(`${nfi.format(x.n.onlyB)} ${lc(p.label.onlyB)} (net ${rsSigned(x.amt.onlyB)})`);
  if(x.n.mismatch)parts.push(`${nfi.format(x.n.mismatch)} amount differences`);
  h+=`<div class="verdict ${vcls}"><b>${vt}</b><p>${parts.length?parts.join('; ')+'.':'Nothing to correct here.'}</p></div>`;

  if(g!=null){const rv=reviews[rvKey(g)]||{};h+=`<div class="review"><label><input type="checkbox" id="rvDone" ${rv.done?'checked':''}> Mark ${esc(p.groupWord.toLowerCase())} reviewed</label><input type="text" id="rvNote" placeholder="Note (saved in this browser)" value="${esc(rv.note||'')}">${rv.at?`<span class="muted" style="font-size:12px">Updated ${esc(new Date(rv.at).toLocaleString())}</span>`:''}</div>`}

  // cards + bridge
  const bline=(c,l,v)=>`<div class="row"><span><span class="sw" style="background:${c}"></span>${l}</span><span class="num">${v<0?'− ':'+ '}${nf.format(Math.abs(v))}</span></div>`;
  const io=(i,o)=>`in ${nf.format(i)}${o?` · out ${nf.format(o)}`:''}`;
  h+=`<div class="compare">
    <div class="card"><div class="t">File 1 · ${esc(p.aShort)} net</div><div class="v">${rs(x.aNet)}</div><div class="s">${nfi.format(x.nA)} rows · ${io(x.aIn,x.aOut)}</div></div>
    <div class="card"><div class="t">File 2 · ${esc(p.bShort)} net</div><div class="v">${rs(x.bNet)}</div><div class="s">${nfi.format(x.nB)} rows · ${io(x.bIn,x.bOut)}</div></div>
    <div class="card bridgecard bridge"><div class="t" style="margin-bottom:6px">Where the difference comes from (in − out)</div>
      <div class="row"><span>${esc(p.aShort)} net</span><span class="num">${nf.format(x.aNet)}</span></div>
      ${bline(COL.duplicate,p.label.duplicate,x.amt.duplicate)}${bline(COL.onlyB,'Add '+lc(p.label.onlyB),x.amt.onlyB)}${bline(COL.onlyA,'Less '+lc(p.label.onlyA),-x.amt.onlyA)}${bline(COL.mismatch,'Amount differences',x.amt.mismatch)}${p.id==='gibl'?bline(COL.probable,'Probable matches',x.amt.probable):''}
      <div class="row tot"><span>${esc(p.bShort)} net</span><span class="num">${nf.format(x.bNet)}</span></div>
      <div class="row"><span class="muted">Net difference</span><span class="num ${Math.abs(x.diff)>0.004?'c-miss':'c-ok'}">${rsSigned(x.diff)}</span></div></div></div>`;
  if(p.hasBal&&g==null&&S.total.closeA!=null){const t=S.total,d=r2(t.closeB-t.closeA);
    h+=`<div class="card" style="margin-bottom:18px"><div class="t">Closing balance check</div><div class="bridge" style="margin-top:6px"><div class="row"><span>Bank statement balance (${esc(t.closeAd)})</span><span class="num">${nf.format(t.closeA)}</span></div><div class="row"><span>CBS GL balance (${esc(t.closeBs)})</span><span class="num">${nf.format(t.closeB)}</span></div><div class="row tot"><span>CBS minus bank</span><span class="num ${Math.abs(d)>0.004?'c-miss':'c-ok'}">${rsSigned(d)}</span></div></div></div>`}

  // summary table
  const rowsSum=[];
  if(g==null)GROUPS.forEach(k=>rowsSum.push([k,p.id==='nic'?k:p.groupLabel(k),S.get(k),'g']));
  else if(p.hasSub&&S.get(g).subs&&!view.sub)[...S.get(g).subs.keys()].sort().forEach(k=>rowsSum.push([k,k,S.get(g).subs.get(k),'s']));
  if(rowsSum.length){
    const z=(n,c)=>n?`<span class="${c}">${nfi.format(n)}</span>`:'<span class="zero">0</span>';
    h+=`<div class="section-title">${g==null?p.groupWord+' summary':'Day by day'}</div><div class="tablewrap"><table><thead><tr><th>${g==null?p.groupWord:'BS date'}</th><th>Status</th><th class="num">${esc(p.aShort)} rows</th><th class="num">${esc(p.aShort)} net</th><th class="num">${esc(p.bShort)} rows</th><th class="num">${esc(p.bShort)} net</th><th class="num">Matched</th>${p.id==='gibl'?'<th class="num">Probable</th>':''}<th class="num">Duplicates</th><th class="num">${esc(p.label.onlyA)}</th><th class="num">${esc(p.label.onlyB)}</th><th class="num">Amt diff</th><th class="num">Net difference</th>${g==null?'<th>Review</th>':''}</tr></thead><tbody>`;
    rowsSum.forEach(([k,lab,y,kind])=>{const st=statusOf(y),rv=kind==='g'?reviews[rvKey(k)]:null;
      h+=`<tr data-${kind}="${esc(k)}"><td><b>${esc(lab)}</b></td><td><span class="pill ${st.cls}">${st.txt}</span></td><td class="num">${nfi.format(y.nA)}</td><td class="num">${nf.format(y.aNet)}</td><td class="num">${nfi.format(y.nB)}</td><td class="num">${nf.format(y.bNet)}</td><td class="num">${z(y.n.matched,'c-ok')}</td>${p.id==='gibl'?`<td class="num">${z(y.n.probable,'c-prob')}</td>`:''}<td class="num">${z(y.n.duplicate,'c-dup')}</td><td class="num">${z(y.n.onlyA,'c-miss')}</td><td class="num">${z(y.n.onlyB,'c-only')}</td><td class="num">${z(y.n.mismatch,'c-diff')}</td><td class="num ${Math.abs(y.diff)>0.004?'c-miss':'c-ok'}">${rsSigned(y.diff)}</td>${kind==='g'?`<td>${rv&&rv.done?'<span class="pill rev">Reviewed</span>':'<span class="muted">Pending</span>'}</td>`:''}</tr>`});
    h+=`</tbody></table></div>`;
  }

  const tabs=['side','onlyA','onlyB','duplicate','mismatch'].concat(p.id==='gibl'?['probable']:[]).concat(['matched']);
  if(!tabs.includes(view.tab))view.tab='side';
  h+=`<div class="tabs" role="tablist">${tabs.map(k=>`<button class="tab" role="tab" data-t="${k}" aria-selected="${view.tab===k}"><span class="dot" style="background:${COL[k]}"></span>${esc(p.label[k])}<span class="n">${nfi.format(x.n[k]||0)}</span></button>`).join('')}</div>`;
  h+=`<p class="tabnote">${esc(p.note[view.tab])}</p>`;
  const ag=p.aggs[view.tab];
  h+=`<div class="toolbar"><input class="search" id="q" type="search" placeholder="Search ID, phone, name, reference, amount…" value="${esc(view.q)}">
    ${view.tab==='side'?`<div class="seg" role="group"><button type="button" data-sm="all" aria-pressed="${view.sideMode==='all'}">All rows</button><button type="button" data-sm="diff" aria-pressed="${view.sideMode==='diff'}">Only differences</button></div>`:''}
    ${ag?`<div class="seg" role="group"><button type="button" data-ag="0" aria-pressed="${!view.agg}">By row</button><button type="button" data-ag="1" aria-pressed="${view.agg}">${esc(ag.label)}</button></div>`:''}
    <button class="btn" id="csvBtn" type="button">Export this list (CSV)</button></div><div class="tablewrap" id="listWrap"></div>`;
  main.innerHTML=h;
  wireTop();
  main.querySelectorAll('tbody tr[data-g]').forEach(tr=>tr.onclick=()=>openGroup(tr.dataset.g));
  main.querySelectorAll('tbody tr[data-s]').forEach(tr=>tr.onclick=()=>{view.sub=tr.dataset.s;view.page=0;renderMain();window.scrollTo({top:0})});
  const cs=$('#clrSub');if(cs)cs.onclick=()=>{view.sub=null;view.page=0;renderMain()};
  main.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{view.tab=b.dataset.t;view.page=0;view.agg=false;renderMain()});
  main.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{if(b.dataset.sm)view.sideMode=b.dataset.sm;if(b.dataset.ag)view.agg=b.dataset.ag==='1';view.page=0;renderMain()});
  const q=$('#q');q.oninput=()=>{view.q=q.value;view.page=0;renderList()};
  $('#csvBtn').onclick=exportCSV;$('#xlsxBtn').onclick=exportXLSX;
  if(g!=null){const save=()=>{reviews[rvKey(g)]={done:$('#rvDone').checked,note:$('#rvNote').value,at:Date.now()};store.set('recon-reviews-v2',reviews);renderRail()};
    $('#rvDone').onchange=()=>{save();toast($('#rvDone').checked?'Marked reviewed':'Review cleared')};$('#rvNote').onchange=save}
  renderList();
}
function renderList(){
  const {rows,cols,agg}=currentList(),p=D.p,wrap=$('#listWrap');
  if(!rows.length){wrap.innerHTML=`<div class="empty">${view.q?'No rows match “'+esc(view.q)+'”. Clear the search to see all.':'No '+esc(lc(p.label[view.tab]))+' here.'}</div>`;return}
  const pages=Math.ceil(rows.length/PAGE);view.page=Math.min(view.page,pages-1);
  const slice=rows.slice(view.page*PAGE,(view.page+1)*PAGE);
  const sumIdx=cols.map((c,i)=>c.t==='n'&&(view.tab==='side'?c.s:/amount|settled/i.test(c.h))?i:-1).filter(i=>i>=0);
  const totals=sumIdx.map(i=>{let t=0;rows.forEach(r=>{t+=+cols[i].f(r)||0});return (cols[i].s?'File '+cols[i].s+' ':'')+cols[i].h.toLowerCase()+' '+rs(t)});
  let h='<table><thead>';
  if(cols.some(c=>c.s)){const n1=cols.filter(c=>c.s===1).length,n2=cols.filter(c=>c.s===2).length,pre=cols.findIndex(c=>c.s===1),post=cols.length-pre-n1-n2;
    h+=`<tr><th colspan="${pre}"></th><th class="grp side-n" colspan="${n1}">File 1 · ${esc(p.aShort)} · ${esc(DS[cur].A.name)}</th><th class="grp" colspan="${n2}">File 2 · ${esc(p.bShort)} · ${esc(DS[cur].B.name)}</th>${post?`<th colspan="${post}"></th>`:''}</tr>`}
  h+=`<tr>${cols.map(c=>`<th class="${c.t&&c.t[0]==='n'?'num':''} ${c.s===1?'side-n':''}">${esc(c.h)}</th>`).join('')}</tr></thead><tbody>`;
  slice.forEach((r,idx)=>{h+=`<tr data-idx="${view.page*PAGE+idx}">${cols.map(c=>{const v=c.f(r);
    if(c.t==='tag')return `<td><span class="tag ${v}">${esc(p.label[v])}</span></td>`;
    const cl=(c.t&&c.t[0]==='n'?'num ':'')+(c.s===1?'side-n ':'')+(c.t==='nd'&&Math.abs(v)>0.004?'c-miss':'');
    return `<td class="${cl}" title="${esc(v)}">${esc(fmtCell(v,c.t))}</td>`}).join('')}</tr>`});
  h+=`</tbody></table><div class="pager"><span>${nfi.format(rows.length)} rows${totals.length?' · '+totals.join(' · '):''}</span><button class="btn small" id="pPrev" ${view.page?'':'disabled'}>Previous</button><span>Page ${view.page+1} of ${pages}</span><button class="btn small" id="pNext" ${view.page<pages-1?'':'disabled'}>Next</button></div>`;
  wrap.innerHTML=h;
  $('#pPrev').onclick=()=>{view.page--;renderList();wrap.scrollIntoView({block:'start'})};
  $('#pNext').onclick=()=>{view.page++;renderList();wrap.scrollIntoView({block:'start'})};
  wrap.querySelectorAll('tbody tr').forEach(tr=>tr.onclick=()=>{const r=rows[+tr.dataset.idx];
    if(agg){const ag=p.aggs[view.tab];view.agg=false;view.q=String(r[ag.cols[0][1]]||'');view.page=0;renderMain();return}
    if(view.tab==='side'){if(r.a)openDrawer(r.a,null);else openDrawer(null,r.b);return}
    if(r.side==='A')openDrawer(r,null);else openDrawer(null,r)});
}

/* ================= drawer ================= */
function openDrawer(a,b){
  const p=D.p;
  const anchor=a||(b&&b.pair>=0?D.A[b.pair]:null);
  let related=anchor?D.B.filter(x=>x.pair===anchor.i):[];
  if(b&&!related.includes(b))related.push(b);
  related.sort((x,y)=>x.i-y.i);
  const head=b||a;
  const kv=o=>`<dl class="kv">${o.map(([k,v])=>`<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('')}</dl>`;
  let h=`<p style="margin:0 0 6px"><span class="tag ${head.st}">${esc(p.label[head.st])}</span>${head.method?` <span class="muted" style="font-size:12px">${esc(head.method)}</span>`:''}</p><p class="muted" style="margin:0 0 10px;font-size:13px">${esc(p.note[head.st])}</p>`;
  h+=`<h4>File 1 · ${esc(p.aShort)}</h4>`;
  if(anchor){h+=kv(p.detailA(anchor));const n=p.noteA(anchor,D.A);if(n)h+=`<p class="muted" style="font-size:13px">${esc(n)}</p>`}
  else h+=`<p class="muted" style="font-size:13px">No ${esc(p.aShort)} row found for this entry.</p>`;
  h+=`<h4>File 2 · ${esc(p.bShort)} (${related.length})</h4>`;
  if(!related.length)h+=`<p class="muted" style="font-size:13px">No ${esc(p.bShort)} entry for this row.</p>`;
  related.forEach(c=>{const k=p.cardB(c);h+=`<div class="post ${b&&c.i===b.i?'hl':''}"><div><b>${esc(k.title)}</b> <span class="tag ${c.st}">${esc(p.label[c.st])}</span><div class="muted">${esc(k.sub)}</div><div class="muted" style="font-size:12px;white-space:normal">${esc(k.ref)}</div></div><div class="num"><b>${nf.format(k.amt)}</b><div class="muted" style="font-size:12px">bal ${nf.format(+k.bal||0)}</div></div></div>`});
  $('#dTitle').textContent=b?p.titleB(b):p.titleA(a);
  $('#dBody').innerHTML=h;
  $('#drawer').classList.add('open');$('#scrim').classList.add('open');$('#drawer').setAttribute('aria-hidden','false');$('#dClose').focus();
}
function closeDrawer(){$('#drawer').classList.remove('open');$('#scrim').classList.remove('open');$('#drawer').setAttribute('aria-hidden','true')}
$('#dClose').onclick=closeDrawer;$('#scrim').onclick=closeDrawer;
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDrawer()});

/* ================= lookup ================= */
$('#lookupForm').onsubmit=e=>{e.preventDefault();const v=$('#lookupInput').value.trim();
  if(!D){toast('Load both files first.');return}
  if(!v){openGroup(null);return}
  if(S.has(v)){openGroup(v);$('#lookupInput').value='';return}
  const m=/^(\d{4})[\/-](\d{1,2})[\/-](\d{1,2})$/.exec(v);
  if(m&&cur==='gibl'){const bs=m[1]+'/'+pad(m[2])+'/'+pad(m[3]);const g=bs.slice(0,7);if(S.has(g)&&S.get(g).subs.has(bs)){openGroup(g,bs);$('#lookupInput').value='';return}}
  const m2=/^(\d{4})[\/-](\d{1,2})$/.exec(v);if(m2){const g=m2[1]+'/'+pad(m2[2]);if(S.has(g)){openGroup(g);$('#lookupInput').value='';return}}
  toast(`${v} is not in either file.`)};

/* ================= exports ================= */
let dl=null;
async function saveFile(filename,data){
  try{
    if(!dl&&window.claude&&window.claude.use)dl=await window.claude.use('downloads');
    if(dl){await dl.save({filename,data});return}
    const blob=data instanceof Blob?data:new Blob([data]);const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);
  }catch(err){if(err&&err.code==='declined')return;toast(err&&err.code==='rate_limited'?'A save prompt is already open.':'Could not save the file here.')}
}
const tagName=()=>cur+'-'+(view.g==null?'all':String(view.g).replace(/\//g,'-'))+(view.sub?'-'+view.sub.replace(/\//g,'-'):'');
const hdr=c=>(c.s?'File '+c.s+' ':'')+c.h;
const cellOut=(c,r)=>{const v=c.f(r);return c.t==='tag'?D.p.label[v]:v};
function exportCSV(){
  const {rows,cols}=currentList();
  const q=v=>{v=String(v==null?'':v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
  const out=[cols.map(c=>q(hdr(c))).join(',')].concat(rows.map(r=>cols.map(c=>q(cellOut(c,r))).join(','))).join('\r\n');
  saveFile(`recon-${tagName()}-${view.tab}${view.agg?'-grouped':''}.csv`,'\ufeff'+out);
}
function exportXLSX(){
  if(!window.XLSX){toast('Excel export needs the spreadsheet library, which did not load. Use CSV instead.');return}
  const p=D.p,wb=XLSX.utils.book_new();
  const ids=view.g==null?GROUPS:[view.g];
  const sum=[[p.groupWord,p.aShort+' rows',p.aShort+' net',p.bShort+' rows',p.bShort+' net','Matched','Probable','Duplicates',p.label.onlyA,p.label.onlyB,'Amount differs','Net difference','Reviewed','Note']];
  ids.forEach(k=>{const y=S.get(k),rv=reviews[rvKey(k)]||{};sum.push([p.id==='nic'?k:p.groupLabel(k),y.nA,y.aNet,y.nB,y.bNet,y.n.matched,y.n.probable,y.n.duplicate,y.n.onlyA,y.n.onlyB,y.n.mismatch,y.diff,rv.done?'Yes':'No',rv.note||''])});
  const ws=XLSX.utils.aoa_to_sheet(sum);ws['!cols']=sum[0].map(()=>({wch:16}));XLSX.utils.book_append_sheet(wb,ws,'Summary');
  const saved={tab:view.tab,agg:view.agg,q:view.q,sideMode:view.sideMode};view.q='';view.sideMode='all';
  const tabs=['side','onlyA','onlyB','duplicate','mismatch'].concat(p.id==='gibl'?['probable']:[]).concat(['matched']);
  tabs.forEach(t=>{view.tab=t;view.agg=false;const {rows,cols}=currentList();if(!rows.length&&t!=='side')return;
    const aoa=[cols.map(hdr)].concat(rows.map(r=>cols.map(c=>cellOut(c,r))));const w=XLSX.utils.aoa_to_sheet(aoa);w['!cols']=cols.map(()=>({wch:16}));XLSX.utils.book_append_sheet(wb,w,p.label[t].slice(0,31));
    if(p.aggs[t]){view.agg=true;const g2=currentList();const a2=[g2.cols.map(hdr)].concat(g2.rows.map(r=>g2.cols.map(c=>cellOut(c,r))));XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(a2),(p.label[t]+' '+p.aggs[t].label.toLowerCase()).slice(0,31))}});
  Object.assign(view,saved);
  const buf=XLSX.write(wb,{bookType:'xlsx',type:'array'});
  saveFile(`recon-report-${tagName()}.xlsx`,new Blob([buf]));
}

/* ================= file loading ================= */
function readBook(file){return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>{try{
  const data=new Uint8Array(fr.result);
  const peek=XLSX.read(data,{type:'array',sheetRows:40});
  let hit=null;for(const n of peek.SheetNames){const rows=XLSX.utils.sheet_to_json(peek.Sheets[n],{header:1,defval:'',raw:true});const d=detect(rows);if(d){hit={name:n,...d};break}}
  if(!hit){res(null);return}
  const wb=XLSX.read(data,{type:'array',cellDates:true,sheets:[hit.name]});
  const rows=XLSX.utils.sheet_to_json(wb.Sheets[hit.name],{header:1,defval:'',raw:true});
  const d=detect(rows)||hit;
  res({kind:d.kind,hi:d.hi,rows,sheet:hit.name});
}catch(e){rej(e)}};fr.onerror=()=>rej(fr.error);fr.readAsArrayBuffer(file)})}
async function addFile(file,slot){
  if(!window.XLSX){toast('The spreadsheet reader did not load, so files cannot be read right now.');return}
  try{
    toast('Reading '+file.name+'…');
    const b=await readBook(file);
    if(!b)throw new Error(file.name+' is not a recognised export. Supported: NIC Asia settlement, Coop session ledger, Global IME bank statement, CBS GL statement.');
    const k=KINDS[b.kind],p=P[k.p];
    const rows=k.side==='A'?p.parseA(b.rows,b.hi):p.parseB(b.rows,b.hi);
    if(!rows.length)throw new Error(file.name+' has no transaction rows.');
    DS[k.p][k.side]={name:file.name,rows};
    const moved=slot&&(k.p!==cur||k.side!==slot);
    switchTo(k.p);
    toast(`${file.name} read as ${k.label} (File ${k.side==='A'?1:2}${k.p!==cur?'':''})${moved?' — placed automatically':''}. ${nfi.format(rows.length)} rows.`);
  }catch(e){toast(e.message||String(e))}
}
function wireTop(){
  document.querySelectorAll('.mode').forEach(b=>b.onclick=()=>switchTo(b.dataset.p));
  document.querySelectorAll('.fcard').forEach(card=>{
    const inp=card.querySelector('input');inp.onchange=()=>{if(inp.files[0])addFile(inp.files[0],card.dataset.side)};
    card.ondragover=e=>{e.preventDefault();card.classList.add('drag')};card.ondragleave=()=>card.classList.remove('drag');
    card.ondrop=e=>{e.preventDefault();card.classList.remove('drag');[...e.dataTransfer.files].forEach(f=>addFile(f,card.dataset.side))};
  });
}
function switchTo(p){cur=p;reconcile();view.g=null;view.sub=null;view.tab='side';view.q='';view.page=0;view.agg=false;renderRail();renderMain();
  $('#srcLine').textContent=D?`${DS[cur].A.name} vs ${DS[cur].B.name}`:P[cur].title}
$('#loadBtn').onclick=()=>{const i=document.createElement('input');i.type='file';i.multiple=true;i.accept='.xlsx,.xls,.csv';i.onchange=()=>[...i.files].forEach(f=>addFile(f,null));i.click()};

/* ================= boot ================= */
let seed={};try{seed=JSON.parse($('#seed').textContent)}catch(e){}
['nic','gibl'].forEach(p=>{if(seed[p]){if(seed[p].A)DS[p].A=seed[p].A;if(seed[p].B)DS[p].B=seed[p].B}});
cur=seed.active||(DS.gibl.A&&DS.gibl.B?'gibl':'nic');
switchTo(cur);
window.__recon={DS,P,get D(){return D},get S(){return S},parse:(kind,rows)=>{const d=detect(rows);const k=KINDS[d.kind],p=P[k.p];return {kind:d.kind,rows:k.side==='A'?p.parseA(rows,d.hi):p.parseB(rows,d.hi)}}};
})();
</script>
